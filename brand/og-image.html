<!doctype html>
<!-- Source for public/img/og-image.png, the 1200×630 picture shown when a
     heybible.org link is shared. Render it with `npm run brand`. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hey Bible share image</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      .canvas {
        width: 1200px;
        height: 630px;
        padding: 0 84px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .lockup { --logo: 100px; }
      .tagline {
        margin: 36px 0 0;
        font-size: 40px;
        line-height: 1.25;
        color: var(--soft-ink);
      }
      .sticker { --cut: 7px; width: 400px; transform: rotate(3deg); }
    </style>
  </head>
  <body>
    <div class="canvas">
      <span class="decor" data-art="sprig-rose" style="width: 150px; left: -34px; bottom: -22px; transform: rotate(-24deg)"></span>
      <span class="decor" data-art="sprig-sage" style="width: 150px; right: -30px; top: -34px; transform: rotate(204deg)"></span>
      <div>
        <div class="lockup"><span data-art="mark"></span><span class="wordmark">Hey Bible</span></div>
        <p class="tagline">Your complete Bible companion</p>
      </div>
      <span class="sticker" data-art="meadow"></span>
    </div>
    <script src="art.js"></script>
  </body>
</html>
