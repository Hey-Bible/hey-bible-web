<!doctype html>
<!-- Facebook page cover: 1640×624. Phones show only the middle of it (about
     1100 wide), so everything that matters sits in the middle. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hey Bible Facebook cover</title>
    <link rel="stylesheet" href="../brand.css" />
    <style>
      .canvas {
        width: 1640px;
        height: 624px;
        padding: 0 320px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .lockup { --logo: 92px; }
      .tagline { margin: 28px 0 0; font-size: 34px; color: var(--soft-ink); }
      .sticker { --cut: 7px; width: 370px; transform: rotate(3deg); }
    </style>
  </head>
  <body>
    <div class="canvas">
      <span class="decor" data-art="sprig-rose" style="width: 170px; left: -30px; bottom: -30px; transform: rotate(-24deg)"></span>
      <span class="decor" data-art="sprig-sage" style="width: 170px; right: -30px; top: -40px; transform: rotate(204deg)"></span>
      <span class="sticker" data-art="sun" style="position: absolute; --cut: 5px; width: 110px; left: 110px; top: 90px; transform: rotate(-8deg)"></span>
      <span class="sticker" data-art="sheep" style="position: absolute; --cut: 5px; width: 150px; right: 90px; bottom: 80px; transform: rotate(5deg)"></span>
      <span class="sticker" data-art="bible" style="position: absolute; --cut: 5px; width: 150px; left: 116px; top: 372px; transform: rotate(-6deg)"></span>
      <span class="sticker" data-art="dove" style="position: absolute; --cut: 5px; width: 140px; right: 96px; top: 118px; transform: rotate(5deg)"></span>
      <span class="bit" data-art="sprig-sage" style="left: 700px; top: 108px; width: 68px; rotate: 70deg"></span>
      <span class="bit" data-art="sprig-rose" style="left: 566px; top: 522px; width: 66px; rotate: -100deg"></span>
      <span class="bit" data-art="sprig-sage" style="left: 1574px; top: 330px; width: 62px; rotate: 15deg"></span>
      <span class="bit" data-art="star" style="left: 424px; top: 118px; width: 32px"></span>
      <span class="bit" data-art="star" style="left: 904px; top: 78px; width: 24px; color: var(--rose)"></span>
      <span class="bit" data-art="star" style="left: 1352px; top: 92px; width: 26px; color: var(--sage)"></span>
      <span class="bit" data-art="star" style="left: 862px; top: 544px; width: 30px"></span>
      <span class="bit" data-art="star" style="left: 1186px; top: 562px; width: 24px; color: var(--rose)"></span>
      <span class="bit" data-art="star" style="left: 58px; top: 296px; width: 24px; color: var(--sage)"></span>
      <div>
        <div class="lockup"><span data-art="mark"></span><span class="wordmark">Hey Bible</span></div>
        <p class="tagline">Search, study and share Scripture</p>
      </div>
      <span class="sticker" data-art="meadow"></span>
    </div>
    <script src="../art.js"></script>
  </body>
</html>
