<!doctype html>
<!-- The verse card from the daily verse videos, for the blog post about it:
     public/img/blog/daily-verse-videos-card.jpg (the post's hero picture) and
     public/video/daily-verse-card.mp4 (the card leaving and flipping back in).
     Render the picture with `npm run brand` and the video with
     `npm run brand:video -- daily-verse`. Open this file with ?play to watch.

     This is not one of the posted clips. It is the card redrawn over the
     post's landscape, to the measurements the app uses when it lays the same
     card on a verse image (hey-bible-app, supabase/functions/venice/
     verse-card.ts, which were taken off stills of the videos): the plate is
     78.75% of the width and centred 59.17% of the way down, filled #12100C at
     36%; the reference is gold (#E8C47A), the verse cream (#FFF8EB) in a
     serif at 3.8% of the width.

     The verse is World English Bible, which is free to set in a picture. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The daily verse card</title>
    <link rel="stylesheet" href="motion.css" />
    <style>
      html,
      body {
        margin: 0;
      }
      .canvas {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #232b3d;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Holds the plate at its centre line and gives the flip some depth */
      .slot {
        position: absolute;
        left: 136px;
        width: 1008px;
        top: 426px;
        transform: translateY(-50%);
        perspective: 1500px;
      }
      .plate {
        box-sizing: border-box;
        padding: 23px 48px;
        border-radius: 16px;
        background: rgba(18, 16, 12, 0.36);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.51);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.43);
        font-family: 'Liberation Sans', Arial, Helvetica, sans-serif;
      }
      .ref {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
        line-height: 1.15;
        color: #e8c47a;
      }
      .abbr {
        font-size: 18px;
        color: rgba(232, 214, 176, 0.9);
      }
      .rule {
        width: 115px;
        height: 2px;
        background: #e8c47a;
      }
      .verse {
        font-family: 'Liberation Serif', 'Times New Roman', Times, serif;
        font-size: 48px;
        line-height: 1.47;
        color: #fff8eb;
        text-wrap: balance;
      }
      .mark {
        position: absolute;
        right: 25px;
        bottom: 25px;
        font-family: 'Liberation Sans', Arial, Helvetica, sans-serif;
        font-size: 23px;
        color: rgba(255, 248, 235, 0.32);
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.27);
      }

      /* The loop starts and ends with the card in place, so the picture is the
         first frame. The card slips away, the landscape has half a second to
         itself, and the card flips back in from the bottom edge, like a page
         turning up from the horizon. */
      .m-vcard {
        transform-origin: 50% 100%;
        animation-name: m-vcard;
      }
      @keyframes m-vcard {
        0%, 25% { opacity: 1; transform: translateY(0) rotateX(0deg); animation-timing-function: ease-in; }
        31% { opacity: 0; transform: translateY(14px) rotateX(0deg); animation-timing-function: step-end; }
        37.5% { opacity: 0; transform: translateY(0) rotateX(82deg); animation-timing-function: ease-out; }
        46% { opacity: 1; transform: translateY(0) rotateX(-7deg); animation-timing-function: ease-in-out; }
        51%, 100% { opacity: 1; transform: translateY(0) rotateX(0deg); }
      }
      /* The picture pushes in very slowly and settles back */
      .m-vscene {
        transform-origin: 50% 60%;
        animation-name: m-vscene;
      }
      @keyframes m-vscene {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <img class="scene m-vscene" src="../public/img/blog/daily-verse-videos-hero.webp" alt="" />
      <div class="slot">
        <div class="plate m-vcard">
          <div class="ref">Philippians 4:13 <span class="abbr">WEB</span></div>
          <div class="rule"></div>
          <div class="verse">I can do all things through Christ, who strengthens me.</div>
        </div>
      </div>
      <div class="mark">@heybibleapp</div>
    </div>
    <script>
      if (new URLSearchParams(location.search).has('play')) document.documentElement.classList.add('play');
    </script>
  </body>
</html>
