<!doctype html>
<!--
  Post template for Instagram, Facebook and X. One file makes every shape: it
  fills whatever window it is opened in, so render it at 1080×1080 (square),
  1080×1350 (portrait) or 1080×1920 (story).

  What it says comes from the address:
    text   the verse or message
    ref    the label above it, for example "Psalm 23:1 · WEB"
    art    any drawing in ../art.js: meadow, meadow-night, sheep, shepherd,
           bible, dove, lamp, cross, sun, moon and so on (default meadow, or
           moon at night)
    night  add this for the dark version

  Example:
    post.html?ref=Psalm 23:1 · WEB&text=Yahweh is my shepherd: I shall lack nothing.

  Use a public-domain translation (WEB, KJV) unless the translation's licence
  allows the verse to be set in a picture.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hey Bible post template</title>
    <link rel="stylesheet" href="../brand.css" />
    <style>
      /* One unit is a 1080th of the width, so the layout scales with the window */
      .canvas {
        --u: calc(100vw / 1080);
        width: 100vw;
        height: 100vh;
        padding: calc(var(--u) * 90) calc(var(--u) * 84);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: calc(var(--u) * 56);
      }
      .art {
        --cut: calc(var(--u) * 9);
        width: calc(var(--u) * 430);
        transform: rotate(-3deg);
      }
      .art[data-art='sheep'] { width: calc(var(--u) * 380); }
      .art[data-art='sun'], .art[data-art='moon'] { width: calc(var(--u) * 300); }
      /* Stories are tall: bigger art, and room kept clear at the top and bottom
         for the app's own buttons */
      .tall { padding-top: calc(var(--u) * 260); padding-bottom: calc(var(--u) * 300); }
      .tall .art { width: calc(var(--u) * 560); }
      .tall .ref { font-size: calc(var(--u) * 34); }
      .tall .text { font-size: calc(var(--u) * 62); }
      .tall .text.long { font-size: calc(var(--u) * 50); }
      .tall .text.longer { font-size: calc(var(--u) * 40); }
      /* The art and the plate each carry a few sprigs and stars with them, so
         the scatter keeps clear of both whatever shape the post is */
      .scene { position: relative; width: 100%; display: flex; justify-content: center; }
      .plate-wrap { position: relative; width: 100%; }
      /* A square post has no room under the plate */
      .canvas:not(.roomy) .roomy { display: none; }
      .plate {
        box-sizing: border-box;
        width: 100%;
        padding: calc(var(--u) * 52) calc(var(--u) * 56);
        background: var(--card);
        border: calc(var(--u) * 12) solid var(--edge);
        border-radius: calc(var(--u) * 48);
        box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 40) var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--u) * 30);
        text-align: center;
      }
      .ref {
        font-size: calc(var(--u) * 30);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--terracotta);
      }
      .text {
        font-size: calc(var(--u) * 52);
        line-height: 1.3;
        text-wrap: balance;
      }
      .text.long { font-size: calc(var(--u) * 42); }
      .text.longer { font-size: calc(var(--u) * 34); }
      .foot {
        position: absolute;
        left: calc(var(--u) * 84);
        right: calc(var(--u) * 84);
        bottom: calc(var(--u) * 56);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: calc(var(--u) * 26);
        color: var(--soft-ink);
      }
      .tall .foot { bottom: calc(var(--u) * 190); }
      .lockup { --logo: calc(var(--u) * 40); }
    </style>
  </head>
  <body>
    <div class="canvas" id="canvas">
      <span class="decor" data-art="sprig-sage" style="width: calc(var(--u) * 150); right: calc(var(--u) * -34); top: calc(var(--u) * -36); transform: rotate(204deg)"></span>
      <span class="decor" data-art="sprig-rose" style="width: calc(var(--u) * 150); left: calc(var(--u) * -36); bottom: calc(var(--u) * 110); transform: rotate(-24deg)"></span>
      <span class="bit" data-art="star" style="left: 30%; top: 7%; width: calc(var(--u) * 30); color: var(--rose)"></span>
      <span class="bit" data-art="star" style="left: 66%; top: 10%; width: calc(var(--u) * 24); color: var(--sage)"></span>
      <div class="scene">
        <span class="art sticker" id="art"></span>
        <span class="bit" data-art="star" style="left: 8%; top: 20%; width: calc(var(--u) * 40)"></span>
        <span class="bit" data-art="sprig-sage" style="left: 14%; top: 74%; width: calc(var(--u) * 76); rotate: 30deg"></span>
        <span class="bit" data-art="star" style="left: 90%; top: 34%; width: calc(var(--u) * 30); color: var(--sage)"></span>
        <span class="bit" data-art="sprig-rose" style="left: 93%; top: 82%; width: calc(var(--u) * 70); rotate: -30deg"></span>
      </div>
      <div class="plate-wrap">
        <div class="plate">
          <span class="ref" id="ref"></span>
          <span class="text" id="text"></span>
        </div>
        <span class="bit roomy" data-art="sprig-sage" style="left: 24%; top: calc(100% + calc(var(--u) * 95)); width: calc(var(--u) * 70); rotate: 75deg"></span>
        <span class="bit roomy" data-art="star" style="left: 62%; top: calc(100% + calc(var(--u) * 75)); width: calc(var(--u) * 34)"></span>
        <span class="bit roomy" data-art="star" style="left: 88%; top: calc(100% + calc(var(--u) * 125)); width: calc(var(--u) * 26); color: var(--rose)"></span>
      </div>
      <div class="foot">
        <div class="lockup"><span data-art="mark"></span><span class="wordmark">Hey Bible</span></div>
        <span>@heybibleapp</span>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const text = params.get('text') || 'Yahweh is my shepherd: I shall lack nothing.';
      const night = params.has('night');
      document.getElementById('canvas').classList.toggle('night', night);
      document.getElementById('canvas').classList.toggle('tall', innerHeight / innerWidth > 1.5);
      document.getElementById('canvas').classList.toggle('roomy', innerHeight / innerWidth > 1.2);
      document.getElementById('art').dataset.art = params.get('art') || (night ? 'moon' : 'meadow');
      document.getElementById('ref').textContent = params.get('ref') || 'Psalm 23:1 · WEB';
      const textEl = document.getElementById('text');
      textEl.textContent = text;
      textEl.classList.toggle('long', text.length > 140);
      textEl.classList.toggle('longer', text.length > 260);
    </script>
    <script src="../art.js"></script>
  </body>
</html>
